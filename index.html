<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinboard — твоя коллекция</title>
<style>
  :root { --bg: #121212; --surface: #1e1e1e; --surface-2: #2a2a2a; --text: #f1f1f1; --muted: #9a9a9a; --accent: #e60023; --accent-hover: #ff1a3d; --radius: 16px; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 50; background: rgba(18,18,18,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid #2a2a2a; padding: 12px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .logo { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .logo .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .nav-tabs { display: flex; gap: 4px; background: var(--surface); border-radius: 999px; padding: 4px; flex-wrap: wrap; }
  .nav-tab { background: transparent; border: none; color: var(--muted); padding: 8px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.2s, color 0.2s; white-space: nowrap; }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.active { background: var(--accent); color: #fff; }
  .search-wrap { flex: 1; min-width: 140px; position: relative; }
  .search-wrap input { width: 100%; padding: 10px 16px 10px 40px; border-radius: 999px; border: 1px solid #333; background: var(--surface); color: var(--text); font-size: 0.9rem; outline: none; transition: border-color 0.2s, background 0.2s; }
  .search-wrap input:focus { border-color: var(--accent); background: var(--surface-2); }
  .search-wrap .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.9rem; pointer-events: none; }
  .upload-btn { background: var(--accent); color: #fff; border: none; padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; cursor: pointer; white-space: nowrap; transition: background 0.2s, transform 0.1s; }
  .upload-btn:hover { background: var(--accent-hover); }
  .upload-btn:active { transform: scale(0.97); }
  .upload-btn.secondary { background: var(--surface-2); color: var(--text); }
  .upload-btn.secondary:hover { background: #383838; }
  .screen { display: none; }
  .screen.active { display: block; }
  #dropZone { max-width: 1400px; margin: 20px auto 0; padding: 0 20px; }
  .drop-inner { border: 2px dashed #3a3a3a; border-radius: var(--radius); padding: 32px 20px; text-align: center; color: var(--muted); font-size: 0.95rem; transition: border-color 0.2s, background 0.2s; cursor: pointer; }
  .drop-inner:hover, .drop-inner.dragover { border-color: var(--accent); background: rgba(230,0,35,0.06); color: var(--text); }
  .drop-inner strong { color: var(--text); }
  #feedGrid, #profileGrid, #likedGrid { max-width: 1400px; margin: 24px auto 60px; padding: 0 20px; column-count: 4; column-gap: 16px; }
  @media (max-width: 1100px) { #feedGrid, #profileGrid, #likedGrid { column-count: 3; } }
  @media (max-width: 800px)  { #feedGrid, #profileGrid, #likedGrid { column-count: 2; } }
  @media (max-width: 500px)  { #feedGrid, #profileGrid, #likedGrid { column-count: 1; } }
  .card { break-inside: avoid; margin-bottom: 16px; background: var(--surface); border-radius: var(--radius); overflow: hidden; position: relative; transition: transform 0.2s, box-shadow 0.2s; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  .card img { width: 100%; display: block; cursor: zoom-in; }
  .card-top-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 5; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; background: rgba(255,255,255,0.92); color: #222; font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, transform 0.1s; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
  .icon-btn:hover { background: #fff; transform: scale(1.08); }
  .icon-btn.danger:hover { background: #ffcdd2; color: #c62828; }
  .icon-btn.liked { color: var(--accent); }
  .card-bottom { padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--muted); background: var(--surface); }
  .title-wrap { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; }
  .title-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty-state .big { font-size: 3rem; margin-bottom: 12px; }
  
  /* Профиль */
  .profile-header { max-width: 1400px; margin: 32px auto 0; padding: 0 20px; display: flex; align-items: flex-start; gap: 24px; flex-wrap: wrap; }
  .avatar-wrap { position: relative; flex-shrink: 0; }
  .avatar { width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #ff6b6b); display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; color: #fff; box-shadow: 0 8px 24px rgba(230,0,35,0.35); overflow: hidden; background-size: cover; background-position: center; }
  .avatar-edit { position: absolute; bottom: -2px; right: -2px; width: 32px; height: 32px; border-radius: 50%; background: var(--surface-2); border: 2px solid var(--bg); color: var(--text); font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .avatar-edit:hover { background: #383838; }
  .profile-info { flex: 1; min-width: 220px; }
  .profile-info h2 { margin: 0 0 4px; font-size: 1.5rem; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .profile-info .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 12px; }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; background: transparent; border: none; color: inherit; font-family: inherit; text-align: left; padding: 0; cursor: default; }
  .stat .num { font-size: 1.25rem; font-weight: 800; }
  .stat .label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .profile-section-title { max-width: 1400px; margin: 40px auto 0; padding: 0 20px; font-size: 1.1rem; font-weight: 700; }
  .profile-upload { max-width: 1400px; margin: 16px auto 0; padding: 0 20px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  
  /* Модалки */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 150; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: 16px; padding: 24px; width: 100%; max-width: 460px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); max-height: 90vh; overflow-y: auto; }
  .modal h3 { margin: 0 0 16px; font-size: 1.1rem; }
  .modal label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
  .modal input[type="text"], .modal textarea { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #3a3a3a; background: var(--surface-2); color: var(--text); font-size: 0.95rem; outline: none; font-family: inherit; resize: vertical; }
  .modal input[type="text"]:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .modal button { padding: 10px 18px; border-radius: 999px; border: none; font-weight: 600; font-size: 0.9rem; cursor: pointer; }
  .modal .cancel { background: var(--surface-2); color: var(--text); }
  .modal .cancel:hover { background: #383838; }
  .modal .confirm { background: var(--accent); color: #fff; }
  .modal .confirm:hover { background: var(--accent-hover); }
  .modal-avatar-row { display: flex; align-items: center; gap: 14px; margin-top: 6px; flex-wrap: wrap; }
  .modal-avatar-preview { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #ff6b6b); background-size: cover; background-position: center; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; overflow: hidden; }

  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 95vw; max-height: 90vh; border-radius: 12px; }
  #lightbox .close { position: absolute; top: 20px; right: 24px; background: rgba(255,255,255,0.1); border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 1.4rem; cursor: pointer; }
  
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface-2); color: var(--text); padding: 12px 20px; border-radius: 999px; font-size: 0.85rem; box-shadow: 0 8px 30px rgba(0,0,0,0.5); opacity: 0; transition: transform 0.3s, opacity 0.3s; z-index: 200; pointer-events: none; max-width: 90vw; text-align: center; }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="dot"></span>Pinboard</div>
  <div class="nav-tabs">
    <button type="button" class="nav-tab active" data-screen="feed">Лента</button>
    <button type="button" class="nav-tab" data-screen="profile">Моя страница</button>
    <button type="button" class="nav-tab" data-screen="liked">Понравившиеся</button>
  </div>
  <div class="search-wrap">
    <span class="icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Поиск по названию...">
  </div>
  <button type="button" class="upload-btn" id="uploadBtn">+ Загрузить</button>
  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  <input type="file" id="avatarInput" accept="image/*" hidden>
</header>

<div class="screen active" id="screen-feed">
  <div id="dropZone">
    <div class="drop-inner" id="dropInner">Перетащите картинки сюда или <strong>нажмите</strong></div>
  </div>
  <div id="feedGrid"><div class="empty-state"><div class="big">⏳</div><div>Загрузка...</div></div></div>
</div>

<div class="screen" id="screen-profile">
  <div class="profile-header">
    <div class="avatar-wrap">
      <div class="avatar" id="avatar">Я</div>
      <button type="button" class="avatar-edit" id="avatarEditBtn">📷</button>
    </div>
    <div class="profile-info">
      <h2>
        <span id="profileName">Мой профиль</span>
        <button type="button" class="upload-btn secondary" id="editProfileBtn" style="font-size:0.8rem;padding:8px 14px;">Редактировать</button>
      </h2>
      <div class="sub" id="profileBio">Здесь ваши картинки</div>
      <div class="stats">
        <div class="stat"><span class="num" id="statCount">0</span><span class="label">Картинок</span></div>
        <div class="stat"><span class="num" id="statLikes">0</span><span class="label">Лайков</span></div>
      </div>
    </div>
  </div>
  <div class="profile-upload">
    <button type="button" class="upload-btn" id="uploadBtnProfile">+ Загрузить на страницу</button>
  </div>
  <div class="profile-section-title">Мои картинки</div>
  <div id="profileGrid"></div>
</div>

<div class="screen" id="screen-liked">
  <div class="profile-section-title" style="margin-top:32px;">Понравившиеся</div>
  <div id="likedGrid"></div>
</div>

<div id="lightbox"><button type="button" class="close" id="lightboxClose">✕</button><img id="lightboxImg" src="" alt=""></div>

<!-- Модалка профиля -->
<div class="modal-overlay" id="profileModal">
  <div class="modal">
    <h3>Редактировать профиль</h3>
    <label>Имя</label>
    <input type="text" id="profileNameInput" placeholder="Ваше имя" maxlength="40">
    <label>Описание</label>
    <textarea id="profileBioInput" rows="3" placeholder="О себе" maxlength="160"></textarea>
    <label>Аватар</label>
    <div class="modal-avatar-row">
      <div class="modal-avatar-preview" id="modalAvatarPreview">Я</div>
      <button type="button" class="upload-btn secondary" id="modalAvatarBtn" style="font-size:0.85rem;">Загрузить</button>
      <button type="button" class="upload-btn secondary" id="modalAvatarRemove" style="font-size:0.85rem;">Убрать</button>
    </div>
    <div class="actions">
      <button type="button" class="cancel" id="profileModalCancel">Отмена</button>
      <button type="button" class="confirm" id="profileModalConfirm">Сохранить</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB0DUpOJWSOX8pJ52q-AAJwpNSzzSlEv1g",
    authDomain: "my-pinboard-dab6c.firebaseapp.com",
    projectId: "my-pinboard-dab6c",
    storageBucket: "my-pinboard-dab6c.firebasestorage.app",
    messagingSenderId: "19292001848",
    appId: "1:19292001848:web:9e010435ca8b66af5db8cd"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  let images = [];
  let searchQuery = '';
  let profile = { name: 'Мой профиль', bio: 'Здесь ваши картинки', avatar: '' };
  let pendingAvatarDataUrl = null;

  const feedGrid = document.getElementById('feedGrid');
  const profileGrid = document.getElementById('profileGrid');
  const likedGrid = document.getElementById('likedGrid');
  const fileInput = document.getElementById('fileInput');
  const avatarInput = document.getElementById('avatarInput');
  const toastEl = document.getElementById('toast');

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(() => toastEl.classList.remove('show'), 3000);
  }

  // 1. СИНХРОНИЗАЦИЯ КАРТИНОК
  const q = query(collection(db, "images"), orderBy("time", "desc"));
  onSnapshot(q, (snapshot) => {
    images = [];
    snapshot.forEach((doc) => {
      images.push({ id: doc.id, ...doc.data() });
    });
    render();
  });

  // 2. СИНХРОНИЗАЦИЯ ПРОФИЛЯ (один документ с ID 'user')
  onSnapshot(doc(db, "settings", "user"), (docSnap) => {
    if (docSnap.exists()) {
      profile = docSnap.data();
      applyProfile();
    }
  });

  function applyProfile() {
    document.getElementById('profileName').textContent = profile.name || 'Мой профиль';
    document.getElementById('profileBio').textContent = profile.bio || 'Здесь ваши картинки';
    const avatarEl = document.getElementById('avatar');
    if (profile.avatar) {
      avatarEl.style.backgroundImage = 'url(' + profile.avatar + ')';
      avatarEl.textContent = '';
    } else {
      avatarEl.style.backgroundImage = '';
      avatarEl.textContent = (profile.name || 'Я').slice(0, 1).toUpperCase();
    }
  }

  function createCard(img) {
    const card = document.createElement('div');
    card.className = 'card';
    const image = document.createElement('img');
    image.src = img.url;
    image.loading = 'lazy';
    image.onclick = () => {
      document.getElementById('lightboxImg').src = img.url;
      document.getElementById('lightbox').classList.add('open');
    };

    const topActions = document.createElement('div');
    topActions.className = 'card-top-actions';

    const likeBtn = document.createElement('button');
    likeBtn.type = 'button';
    likeBtn.className = 'icon-btn' + (img.liked ? ' liked' : '');
    likeBtn.innerHTML = img.liked ? '❤️' : '🤍';
    likeBtn.onclick = async (e) => {
      e.stopPropagation();
      await updateDoc(doc(db, "images", img.id), { liked: !img.liked });
    };

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'icon-btn danger';
    delBtn.innerHTML = '🗑️';
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      if (confirm('Удалить?')) {
        try {
          await deleteObject(ref(storage, img.url)).catch(()=>{});
          await deleteDoc(doc(db, "images", img.id));
          showToast('Удалено');
        } catch (err) { showToast('Ошибка'); }
      }
    };

    topActions.appendChild(likeBtn);
    topActions.appendChild(delBtn);

    const bottom = document.createElement('div');
    bottom.className = 'card-bottom';
    bottom.innerHTML = `<div class="title-wrap"><span class="title-text">${img.name || 'Без названия'}</span></div><span>${new Date(img.time).toLocaleDateString('ru-RU')}</span>`;

    card.appendChild(image);
    card.appendChild(topActions);
    card.appendChild(bottom);
    return card;
  }

  function fillGrid(gridEl, list) {
    gridEl.innerHTML = '';
    if (list.length === 0) {
      gridEl.innerHTML = '<div class="empty-state"><div class="big">🖼️</div><div>Пока пусто</div></div>';
      return;
    }
    list.forEach(img => gridEl.appendChild(createCard(img)));
  }

  function render() {
    const q = searchQuery.trim().toLowerCase();
    const matches = img => !q || (img.name || '').toLowerCase().includes(q);
    fillGrid(feedGrid, images.filter(matches));
    fillGrid(profileGrid, images.filter(matches));
    fillGrid(likedGrid, images.filter(img => img.liked && matches(img)));
    document.getElementById('statCount').textContent = images.length;
    document.getElementById('statLikes').textContent = images.filter(i => i.liked).length;
  }

  async function handleFiles(files) {
    if (!files || files.length === 0) return;
    const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
    
    for (const file of imageFiles) {
      showToast('Загрузка: ' + file.name);
      try {
        const storageRef = ref(storage, 'images/' + Date.now() + '_' + file.name);
        await uploadBytes(storageRef, file);
        const downloadURL = await getDownloadURL(storageRef);
        await addDoc(collection(db, "images"), {
          url: downloadURL,
          name: file.name.replace(/\.[^.]+$/, ''),
          time: Date.now(),
          liked: false
        });
        showToast('Успешно!');
      } catch (err) {
        console.error(err);
        showToast('Ошибка: ' + err.message);
      }
    }
  }

  // Обработчики загрузки картинок
  document.getElementById('uploadBtn').onclick = () => fileInput.click();
  document.getElementById('uploadBtnProfile').onclick = () => fileInput.click();
  document.getElementById('dropInner').onclick = () => fileInput.click();
  fileInput.onchange = () => { handleFiles(fileInput.files); fileInput.value = ''; };
  document.getElementById('searchInput').oninput = (e) => { searchQuery = e.target.value; render(); };
  
  // Навигация
  document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('screen-' + tab.dataset.screen).classList.add('active');
    };
  });

  // Модалка профиля
  const profileModal = document.getElementById('profileModal');
  const profileNameInput = document.getElementById('profileNameInput');
  const profileBioInput = document.getElementById('profileBioInput');
  const modalAvatarPreview = document.getElementById('modalAvatarPreview');

  document.getElementById('editProfileBtn').onclick = () => {
    profileNameInput.value = profile.name || '';
    profileBioInput.value = profile.bio || '';
    pendingAvatarDataUrl = null;
    updateAvatarPreview(profile.avatar);
    profileModal.classList.add('open');
  };
  document.getElementById('avatarEditBtn').onclick = () => {
    profileNameInput.value = profile.name || '';
    profileBioInput.value = profile.bio || '';
    pendingAvatarDataUrl = null;
    updateAvatarPreview(profile.avatar);
    profileModal.classList.add('open');
  };
  document.getElementById('profileModalCancel').onclick = () => profileModal.classList.remove('open');

  function updateAvatarPreview(src) {
    if (src) {
      modalAvatarPreview.style.backgroundImage = 'url(' + src + ')';
      modalAvatarPreview.textContent = '';
    } else {
      modalAvatarPreview.style.backgroundImage = '';
      modalAvatarPreview.textContent = (profileNameInput.value || 'Я').slice(0, 1).toUpperCase();
    }
  }

  document.getElementById('modalAvatarBtn').onclick = () => avatarInput.click();
  avatarInput.onchange = async () => {
    const file = avatarInput.files[0];
    if (!file) return;
    showToast('Загрузка аватара...');
    try {
      const storageRef = ref(storage, 'avatars/' + Date.now() + '_' + file.name);
      await uploadBytes(storageRef, file);
      pendingAvatarDataUrl = await getDownloadURL(storageRef);
      updateAvatarPreview(pendingAvatarDataUrl);
      showToast('Аватар загружен, нажмите Сохранить');
    } catch (err) {
      showToast('Ошибка загрузки аватара');
    }
    avatarInput.value = '';
  };

  document.getElementById('modalAvatarRemove').onclick = () => {
    pendingAvatarDataUrl = '';
    updateAvatarPreview('');
  };

  document.getElementById('profileModalConfirm').onclick = async () => {
    const newName = profileNameInput.value.trim() || 'Мой профиль';
    const newBio = profileBioInput.value.trim() || 'Здесь ваши картинки';
    let newAvatar = profile.avatar || '';
    if (pendingAvatarDataUrl !== null) newAvatar = pendingAvatarDataUrl;

    try {
      await setDoc(doc(db, "settings", "user"), {
        name: newName,
        bio: newBio,
        avatar: newAvatar
      });
      showToast('Профиль сохранен в облаке');
      profileModal.classList.remove('open');
    } catch (err) {
      showToast('Ошибка сохранения профиля');
    }
  };

  document.getElementById('lightboxClose').onclick = () => document.getElementById('lightbox').classList.remove('open');
</script>
</body>
</html>
